registration:
  method: sift
  loftr_pretrained: outdoor
  loftr_device: cpu
  loftr_max_size: 640
  loftr_confidence: 0.2
  max_feature_size: 1600
  ratio_test: 0.75
  ransac_threshold: 4.0
  min_matches: 12
  min_inliers: 8
  min_inlier_ratio: 0.25
  min_overlap_ratio: 0.10
  seed: 2026
mask:
  method: min_cost
  seam_width: 64
  feather_radius: 24
inpainting:
  engine: diffusion
  # Generate only after protected structural repair is accepted and its
  # residual remains large enough to justify repainting.
  hybrid_diffusion_policy: on_structural_gain
  hybrid_min_residual_error: 2.0
  model_id: stable-diffusion-v1-5/stable-diffusion-inpainting
  revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
  variant: fp16
  controlnet: none
  controlnet_scale: 0.65
  # none preserves the original full-patch Canny control image. The other
  # modes are experimental until they pass the GPU comparison suite.
  controlnet_mask_mode: none
  controlnet_edge_fade: 8
  controlnet_edge_floor: 0.15
  canny_low: 100
  canny_high: 200
  use_lcm: false
  lcm_model_id: latent-consistency/lcm-lora-sdv1-5
  lcm_revision: cf2fced511dbe7e26c8d1d397e728fbab875db4b
  device: auto
  allow_cpu: false
  cpu_threads: 8
  local_files_only: true
  cache_dir: models/hub
  patch_size: 512
  patch_layout: single
  tile_overlap: 128
  context_pixels: 192
  steps: 20
  guidance_scale: 5.0
  strength: 0.5
  seed: 2026
  prompt: seamless continuation of the surrounding texture, preserve the original structure and lighting
  negative_prompt: visible seam, discontinuity, distorted structure, artifacts, text, watermark
blend:
  feather_radius: 24
  color_match: true
  ai_opacity: 1.0
  # Optional runtime guard for experimental diffusion runs. It is off by default
  # until a GPU comparison confirms that the automatic rollback is beneficial.
  ai_boundary_guard: false
  ai_boundary_threshold: 1.15
refinement:
  enabled: false
  exposure: true
  local_flow: true
  flow_min_mae: 2.0
  max_flow_pixels: 16
  seam_softness: 8
neural_alignment:
  method: raft_large
  preserve_detail: true
  device: cpu
  max_size: 512
  iterations: 12
  consistency: 1.5
  max_flow: 24
  exposure: true
clear_fusion:
  enabled: true
  mode: adaptive_detail
  detail_scale: 9
  guard: true
  guard_threshold: 0.985
  clarity_margin: 1.05
  min_clarity_energy: 0.5
  photometric_fraction_threshold: 0.9
  photometric_magnitude_threshold: 2.5
  photometric_agreement_threshold: 0.95
  transition_width: 16
  noise_guard: true
